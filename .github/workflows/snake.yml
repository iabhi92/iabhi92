# Generates two theme-aware animated contribution snakes (snake-dark.svg /
# snake-light.svg) from real GitHub contribution data and commits them back so
# the profile README always has a fresh, moving snake that is visible in BOTH
# light and dark mode (the README swaps them via <picture>). Runs on every push
# and daily.
name: generate-snake

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the snakes
        uses: Platane/snk@v3
        with:
          github_user_name: iabhi92
          outputs: |
            dist/snake-dark.svg?color_snake=39FF14&color_dots=21262d,1f2e1f,2f5c2f,3f9a3f,39FF14
            dist/snake-light.svg?color_snake=2ea043&color_dots=ebedf0,9be9a8,40c463,30a14e,216e39

      - name: Commit them back
        run: |
          cp dist/snake-dark.svg snake-dark.svg
          cp dist/snake-light.svg snake-light.svg
          # note: snk writes dist/ as root; leave it, we only commit the two snakes
          git add snake-dark.svg snake-light.svg
          if git diff --cached --quiet; then
            echo "snakes unchanged; nothing to commit"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: refresh contribution snake animation"
            git push
          fi
