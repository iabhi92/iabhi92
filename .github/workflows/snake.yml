# Generates two theme-aware animated contribution snakes (snake-dark.svg /
# snake-light.svg) from real GitHub contribution data and commits them back so
# the profile README always has a fresh, moving snake that is visible in BOTH
# light and dark mode (the README swaps them via <picture>). Runs on every push
# and daily.
name: generate-snake

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the snakes
        uses: Platane/snk@v3
        with:
          github_user_name: iabhi92
          outputs: |
            dist/snake-dark.svg?color_snake=39FF14&color_dots=21262d,1f2e1f,2f5c2f,3f9a3f,39FF14
            dist/snake-light.svg?color_snake=2ea043&color_dots=ebedf0,9be9a8,40c463,30a14e,216e39

      - name: Post-process for visibility
        run: |
          # snk outputs --cb as #1b1f230a (nearly transparent) which makes the
          # grid invisible on both themes. Fix:
          #  1. Inject a solid background rect so the snake renders as a
          #     self-contained card (not transparent on the page).
          #  2. Replace the near-transparent cell borders with visible colors.
          #
          # Dark: card bg #161b22 (matches GitHub's dark contribution graph),
          #       cell borders #30363d.
          # Light: card bg #f6f8fa, cell borders #d0d7de.
          DARK_RECT='<rect x="-16" y="-32" width="880" height="192" fill="#161b22"/>'
          LIGHT_RECT='<rect x="-16" y="-32" width="880" height="192" fill="#f6f8fa"/>'

          sed -i "s|<svg \(viewBox=\"[^\"]*\"[^>]*\)>|<svg \1>${DARK_RECT}|" dist/snake-dark.svg
          sed -i 's/--cb:#1b1f230a/--cb:#30363d/' dist/snake-dark.svg

          sed -i "s|<svg \(viewBox=\"[^\"]*\"[^>]*\)>|<svg \1>${LIGHT_RECT}|" dist/snake-light.svg
          sed -i 's/--cb:#1b1f230a/--cb:#d0d7de/' dist/snake-light.svg

      - name: Commit them back
        run: |
          cp dist/snake-dark.svg snake-dark.svg
          cp dist/snake-light.svg snake-light.svg
          # note: snk writes dist/ as root; leave it, we only commit the two snakes
          git add snake-dark.svg snake-light.svg
          if git diff --cached --quiet; then
            echo "snakes unchanged; nothing to commit"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: refresh contribution snake animation"
            git push
          fi
